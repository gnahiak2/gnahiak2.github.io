<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Pong — first to seven against a patient machine."
    >

    <meta
        name="theme-color"
        content="#f2ecdc"
    >

    <title>Pong — kaihang arcade</title>

    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../games.css">
    <link rel="stylesheet" href="pong.css">
</head>

<body class="arc-body">

    <div class="background" aria-hidden="true"></div>


    <header class="arc-top">

        <a
            class="arc-back"
            href="../"
        >
            ← arcade
        </a>

        <div class="arc-brand">
            <b>PONG</b>
            <span>1P</span>
        </div>

        <div class="arc-topright">

            <span class="arc-session">
                first to 7 · mouse / arrows / touch
            </span>

        </div>

    </header>


    <main class="game-wrap">

        <section class="game-panel">

            <div class="game-head">

                <div class="game-title">
                    PONG<span>_</span>
                </div>

                <div class="game-stats">

                    <div class="stat">
                        YOU
                        <b id="score-you">0</b>
                    </div>

                    <div class="stat">
                        CPU
                        <b id="score-cpu">0</b>
                    </div>

                </div>

            </div>


            <div class="game-stage">

                <canvas
                    id="board"
                    class="board"
                    width="480"
                    height="340"
                    aria-label="Pong board"
                ></canvas>

                <div class="overlay" id="overlay">

                    <div>

                        <h2 id="overlay-title">
                            Pong
                        </h2>

                        <p id="overlay-text">
                            You are the left paddle. Move with the mouse
                            or the arrow keys and keep the ball in play.
                            First to seven wins.
                        </p>

                        <button
                            class="g-btn primary"
                            id="start-btn"
                            type="button"
                        >
                            Play
                        </button>

                    </div>

                </div>

            </div>


            <div class="game-tools">

                <button
                    class="g-btn primary"
                    id="restart-btn"
                    type="button"
                >
                    New game
                </button>

                <button
                    class="g-btn"
                    id="pause-btn"
                    type="button"
                >
                    Pause
                </button>

                <span class="game-note">
                    space pauses · the ball gets a little faster every hit
                </span>

            </div>

        </section>

    </main>


    <script
        src="pong.js"
        defer
    ></script>

</body>
</html>
